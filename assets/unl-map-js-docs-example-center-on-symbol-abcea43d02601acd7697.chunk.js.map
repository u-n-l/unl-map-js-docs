export default "<div id=\"map\"></div>\n<script>\n  var map = new UnlSdk.Map({\n    container: \"map\",\n    apiKey: \"YOUR-OWN-API-KEY\",\n    vpmId: \"YOUR-OWN-VPM-ID\",\n    center: [-90.96, -0.47],\n    zoom: 7.5,\n  });\n\n  map.on(\"load\", function () {\n    // Add an image to use as a custom marker\n    map.loadImage(\n      \"https://u-n-l.github.io/unl-map-js-docs/assets/custom_marker.png\",\n      function (error, image) {\n        if (error) throw error;\n        map.addImage(\"custom-marker\", image);\n        // Add a GeoJSON source with 3 points.\n        map.addSource(\"points\", {\n          type: \"geojson\",\n          data: {\n            type: \"FeatureCollection\",\n            features: [\n              {\n                type: \"Feature\",\n                properties: {},\n                geometry: {\n                  type: \"Point\",\n                  coordinates: [-91.395263671875, -0.9145729757782163],\n                },\n              },\n              {\n                type: \"Feature\",\n                properties: {},\n                geometry: {\n                  type: \"Point\",\n                  coordinates: [-90.32958984375, -0.6344474832838974],\n                },\n              },\n              {\n                type: \"Feature\",\n                properties: {},\n                geometry: {\n                  type: \"Point\",\n                  coordinates: [-91.34033203125, 0.01647949196029245],\n                },\n              },\n            ],\n          },\n        });\n\n        // Add a symbol layer\n        map.addLayer({\n          id: \"symbols\",\n          type: \"symbol\",\n          source: \"points\",\n          layout: {\n            \"icon-image\": \"custom-marker\",\n          },\n        });\n      }\n    );\n\n    // Center the map on the coordinates of any clicked symbol from the 'symbols' layer.\n    map.on(\"click\", \"symbols\", function (e) {\n      map.flyTo({\n        center: e.features[0].geometry.coordinates,\n      });\n    });\n\n    // Change the cursor to a pointer when the it enters a feature in the 'symbols' layer.\n    map.on(\"mouseenter\", \"symbols\", function () {\n      map.getCanvas().style.cursor = \"pointer\";\n    });\n\n    // Change it back to a pointer when it leaves.\n    map.on(\"mouseleave\", \"symbols\", function () {\n      map.getCanvas().style.cursor = \"\";\n    });\n  });\n</script>\n";

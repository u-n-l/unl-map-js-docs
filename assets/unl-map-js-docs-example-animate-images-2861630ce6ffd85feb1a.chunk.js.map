export default "<div id=\"map\"></div>\n<script>\n  var map = new UnlSdk.Map({\n    container: \"map\",\n    apiKey: \"YOUR-OWN-API-KEY\",\n    vpmId: \"YOUR-OWN-VPM-ID\",\n    maxZoom: 5.99,\n    minZoom: 4,\n    zoom: 5,\n    center: [-75.789, 41.874],\n  });\n\n  var frameCount = 5;\n  var currentImage = 0;\n\n  function getPath() {\n    return (\n      \"https://u-n-l.github.io/unl-map-js-docs/assets/radar\" +\n      currentImage +\n      \".gif\"\n    );\n  }\n\n  map.on(\"load\", function () {\n    map.addSource(\"radar\", {\n      type: \"image\",\n      url: getPath(),\n      coordinates: [\n        [-80.425, 46.437],\n        [-71.516, 46.437],\n        [-71.516, 37.936],\n        [-80.425, 37.936],\n      ],\n    });\n    map.addLayer({\n      id: \"radar-layer\",\n      type: \"raster\",\n      source: \"radar\",\n      paint: {\n        \"raster-fade-duration\": 0,\n      },\n    });\n\n    setInterval(function () {\n      currentImage = (currentImage + 1) % frameCount;\n      map.getSource(\"radar\").updateImage({ url: getPath() });\n    }, 200);\n  });\n</script>\n";

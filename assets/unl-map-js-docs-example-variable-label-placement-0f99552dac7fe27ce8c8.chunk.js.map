export default "<div id=\"map\"></div>\n\n<script>\n  var places = {\n    type: \"FeatureCollection\",\n    features: [\n      {\n        type: \"Feature\",\n        properties: {\n          description: \"Ford's Theater\",\n          icon: \"theatre\",\n        },\n        geometry: {\n          type: \"Point\",\n          coordinates: [-77.038659, 38.931567],\n        },\n      },\n      {\n        type: \"Feature\",\n        properties: {\n          description: \"The Gaslight\",\n          icon: \"theatre\",\n        },\n        geometry: {\n          type: \"Point\",\n          coordinates: [-77.003168, 38.894651],\n        },\n      },\n      {\n        type: \"Feature\",\n        properties: {\n          description: \"Horrible Harry's\",\n          icon: \"bar\",\n        },\n        geometry: {\n          type: \"Point\",\n          coordinates: [-77.090372, 38.881189],\n        },\n      },\n      {\n        type: \"Feature\",\n        properties: {\n          description: \"Bike Party\",\n          icon: \"bicycle\",\n        },\n        geometry: {\n          type: \"Point\",\n          coordinates: [-77.052477, 38.943951],\n        },\n      },\n      {\n        type: \"Feature\",\n        properties: {\n          description: \"Rockabilly Rockstars\",\n          icon: \"music\",\n        },\n        geometry: {\n          type: \"Point\",\n          coordinates: [-77.031706, 38.914581],\n        },\n      },\n      {\n        type: \"Feature\",\n        properties: {\n          description: \"District Drum Tribe\",\n          icon: \"music\",\n        },\n        geometry: {\n          type: \"Point\",\n          coordinates: [-77.020945, 38.878241],\n        },\n      },\n      {\n        type: \"Feature\",\n        properties: {\n          description: \"Motown Memories\",\n          icon: \"music\",\n        },\n        geometry: {\n          type: \"Point\",\n          coordinates: [-77.007481, 38.876516],\n        },\n      },\n    ],\n  };\n\n  var map = new UnlSdk.Map({\n    container: \"map\",\n    apiKey: \"YOUR-OWN-API-KEY\",\n    vpmId: \"YOUR-OWN-VPM-ID\",\n    center: [-77.04, 38.907],\n    zoom: 11.15,\n  });\n\n  map.on(\"load\", function () {\n    // Add a GeoJSON source containing place coordinates and information.\n    map.addSource(\"places\", {\n      type: \"geojson\",\n      data: places,\n    });\n\n    map.addLayer({\n      id: \"poi-labels\",\n      type: \"symbol\",\n      source: \"places\",\n      layout: {\n        \"text-field\": [\"get\", \"description\"],\n        \"text-variable-anchor\": [\"top\", \"bottom\", \"left\", \"right\"],\n        \"text-radial-offset\": 0.5,\n        \"text-justify\": \"auto\",\n        \"icon-image\": [\"concat\", [\"get\", \"icon\"], \"-15\"],\n        \"text-font\": [\"Fira GO Regular\"],\n      },\n    });\n\n    map.rotateTo(180, { duration: 10000 });\n  });\n</script>\n";
